<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chattie</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-row">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="title">Chattie</h1>
      </div>
      <p class="subtitle" id="siteStatus">Detecting site…</p>
    </header>

    <!-- Site Badge -->
    <div class="site-badge-container" id="siteBadgeContainer" style="display:none;">
      <div class="site-badge" id="siteBadge">
        <span class="badge-dot" id="badgeDot"></span>
        <span class="badge-text" id="badgeText"></span>
      </div>
    </div>

    <!-- Action Button -->
    <button class="scrape-btn" id="scrapeBtn" disabled>
      <span class="btn-icon" id="btnIcon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="btn-text" id="btnText">Export as Markdown</span>
    </button>

    <!-- Diagnostic: dump the live page structure to fix selectors -->
    <button class="inspect-btn" id="inspectBtn" disabled>
      <span class="btn-icon" id="inspectIcon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="btn-text" id="inspectText">Inspect page</span>
    </button>

    <!-- Inspection output -->
    <div class="inspect-output" id="inspectOutput" style="display:none;"></div>
    <div class="inspect-hint" id="inspectHint" style="display:none;"></div>

    <!-- Status Messages -->
    <div class="status-area" id="statusArea" style="display:none;">
      <div class="status-message" id="statusMessage"></div>
    </div>

    <!-- Preview Section -->
    <div class="preview-section" id="previewSection" style="display:none;">
      <div class="preview-header">
        <span class="preview-title">Preview</span>
        <span class="preview-count" id="previewCount"></span>
      </div>
      <div class="preview-list" id="previewList"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Works on</span>
      <span class="footer-sites">Claude · ChatGPT · Gemini</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
